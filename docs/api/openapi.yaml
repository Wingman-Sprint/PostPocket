openapi: 3.1.0
info:
  title: PostPocket API
  version: 0.4.2
  description: |
    Kontrak API antara frontend (`apps/web`) dan backend (Supabase Edge Functions). Server
    melayani surat yang dikirim dan kotak bareng; Pocket, TV, dan Booth tetap di browser
    (sinkron Pocket fase 2 memakai klien Supabase langsung, bukan kontrak ini).

    **Alur pengirim**

    1. `POST /letters` dengan `design`, `content`, dan metadata semua berkas. Server membuat
       draf dan mengembalikan `editToken` serta URL upload bertanda tangan per berkas.
    2. Browser mengunggah tiap berkas langsung ke Storage (tidak lewat Edge Function), misalnya
       `supabase.storage.from('letter-assets').uploadToSignedUrl(path, token, file)`.
       URL upload berlaku 2 jam. Kalau mengunggah dengan PUT sendiri, kirim header
       `content-type`, `x-upsert: false`, dan `cache-control: max-age=3600`. Tanpa
       `cache-control`, Storage menyajikan berkasnya dengan `no-cache` dan browser mengunduhnya
       ulang setiap kali (`uploadToSignedUrl` sudah mengirimnya sendiri).
    3. `POST /letters/{id}/publish` dengan header `X-Edit-Token`. Server memeriksa semua berkas
       sudah ada dan sesuai metadata, membuat `slug`, lalu mengembalikan link surat.

    **Alur penerima**

    1. Halaman `/l/{slug}` di-SSR dan memanggil `GET /l/{slug}`. Panggilan ini tidak menandai
       surat sebagai dibuka, jadi crawler WhatsApp aman.
    2. Saat penerima mengetuk kartu, frontend memanggil `POST /l/{slug}/open`.

    **Alur kotak bareng (0.3.0)**

    Banyak pengirim, satu penerima. Dirancang Kall untuk ditinjau dan diterapkan Bintang.

    1. Pembuat kotak memanggil `POST /boxes` dan mendapat dua link: link titip (`inviteUrl`,
       dibagikan ke teman-teman) dan link buka (`url`, untuk penerima), plus `editToken`.
    2. Tiap teman menulis surat biasa lalu `POST /letters` dengan `box` berisi kode titip dan
       namanya, mengunggah berkas, dan `POST /letters/{id}/publish` seperti biasa. Surat titipan
       tidak punya gambar OG dan tidak bisa dibuka lewat `/l/{slug}`.
    3. Kotak ditutup untuk titipan baru begitu `opensAt` lewat: waktu yang dijadwalkan pembuatnya,
       saat pembuatnya menekan "Buka sekarang" (`PATCH /boxes/{id}`), atau paling lambat 30 hari
       setelah kotak dibuat. Selama penerima belum membukanya, pembuatnya masih bisa menjadwal
       ulang: kotaknya tersegel lagi dan titipan diterima lagi sampai jadwal baru (0.4.2).
    4. Penerima membuka link buka: `GET /k/{slug}` mengembalikan semua surat setelah `opensAt`,
       dan `POST /k/{slug}/open` dipanggil saat surat pertama dibuka.

    Semua waktu kotak dibandingkan dengan jam server. Semua 404 di `/boxes/…` dan `/k/…`
    (termasuk id, kode titip, atau slug yang bentuknya salah) berkode `box_not_found`.
    `box_closed` dijawab `409` di `PATCH /boxes/{id}` (penerima sudah membuka kotaknya) dan `422`
    di `POST /letters` serta publish (titipan ditolak).

    **Masa berlaku**

    - Draf yang tidak di-publish dihapus 24 jam setelah dibuat.
    - Surat, gambar OG, dan semua berkasnya dihapus 30 hari setelah publish (`expiresAt`).
    - Foto isi surat dihapus 7 hari setelah surat pertama kali dibuka (`photosExpireAt`).
      Kalau gambar depannya foto user (`design.illustration = "upload"`), cover dan gambar OG
      ikut dihapus saat itu, karena gambar OG memuat foto yang sama. Setelah dihapus, field
      URL-nya bernilai `null` dan frontend menampilkan placeholder.
    - Job pembersihan berjalan tiap jam, tapi `GET /l/{slug}` sudah menyembunyikan berkas tepat
      saat masanya lewat: surat jadi `404` begitu `expiresAt` lewat, dan foto (serta cover dan
      OG kalau gambar depannya foto user) tidak dikembalikan lagi begitu `photosExpireAt` lewat.
      Klien tidak pernah menerima URL berkas yang sudah dihapus.
    - Kotak bareng beserta semua surat titipannya dihapus 30 hari setelah `opensAt`
      (`expiresAt`), bukan 30 hari setelah tiap surat dikirim. Jadi titipan yang dikumpulkan lama
      tidak memotong jatah penerima.
    - Foto dan cover semua surat titipan dihapus 7 hari setelah kotak pertama kali dibuka
      (`photosExpireAt`), dengan placeholder seperti surat biasa.
    - Draf surat titipan yang tidak di-publish dihapus setelah 24 jam, sama seperti surat biasa.

    **Region fungsi**

    Panggil semua endpoint dengan query `?forceFunctionRegion=ap-southeast-2`, misalnya
    `GET /l/{slug}?forceFunctionRegion=ap-southeast-2`. DB dan Storage ada di Sydney, sedangkan
    tanpa query ini fungsi jalan di region terdekat dengan pemanggil (Singapura) dan setiap
    query bolak-balik ke Sydney. Query ini dibaca gateway Supabase, bukan oleh fungsi, jadi
    tidak mengubah respons. Header `x-region` juga bisa, tapi tidak diizinkan CORS.

    **Header umum**

    - `apikey`: publishable key Supabase, wajib di semua request (dikirim otomatis oleh
      `supabase.functions.invoke`). Tanpa header ini, atau kalau isinya bukan publishable key
      proyek, server menjawab `401` dengan kode `unauthorized`.
    - `X-Edit-Token`: khusus publish dan hapus surat, serta semua endpoint `/boxes/{id}`.
    - `Authorization: Bearer <access token>`: sesi login Google, khusus `DELETE /account` (0.4.0).
      Dikirim otomatis oleh `supabase.functions.invoke` selama user login.

    **CORS**

    - Origin yang diizinkan hanya `https://postpocket.vercel.app`, dikembalikan apa adanya di
      `Access-Control-Allow-Origin` (bukan `*`), ditambah `Vary: Origin`.
    - Preview deploy Vercel tidak diterima (sejak 0.2.3): nama `<proyek>.vercel.app` bisa
      didaftarkan siapa saja, jadi pola preview bisa diklaim orang lain. Preview memakai mock API.
    - `http://localhost:3000` tidak diterima di produksi (sejak 0.2.3). Untuk `pnpm dev`, pakai
      mock API atau stack Supabase lokal, yang gateway-nya menjawab
      `Access-Control-Allow-Origin: *`.
    - Semua respons JSON membawa `X-Content-Type-Options: nosniff`.
    - Preflight `OPTIONS` dijawab `204` dengan `Access-Control-Allow-Methods: GET, POST,
      PATCH, DELETE, OPTIONS` (`PATCH` sejak 0.3.0, untuk `PATCH /boxes/{id}`) dan
      `Access-Control-Allow-Headers: apikey, authorization, content-type, x-client-info,
      x-edit-token`.
    - Upload berkas ke `signedUrl` (PUT, tanpa supabase-js juga boleh) dilayani Storage, bukan
      Edge Function, jadi tidak lewat aturan CORS di atas.

    Batas angka `content` sama dengan `contentLimits` di
    `packages/presets/src/letter-content.ts`, dan backend memvalidasi dengan angka yang sama.
servers:
  - url: https://{projectRef}.supabase.co/functions/v1
    variables:
      projectRef:
        default: rmyfkdtqcltawmssollb
        description: Ref proyek Supabase. Proyek staging memakai ref-nya sendiri.
security:
  - publishableKey: []
tags:
  - name: Pengirim
    description: Membuat, menerbitkan, dan menghapus surat. Fungsi `letters`.
  - name: Penerima
    description: Membaca surat lewat slug. Fungsi `l`.
  - name: Kotak
    description: |
      Kotak bareng: membuat dan mengelola kotak (fungsi `boxes`), dan membukanya sebagai penerima
      (fungsi `k`). Surat titipan dibuat lewat `POST /letters` dengan `box`.
  - name: Akun
    description: Akun login Google untuk cadangan Pocket (fase 2). Fungsi `account`.

paths:
  /letters:
    post:
      tags: [Pengirim]
      operationId: createLetter
      summary: Buat draf surat dan URL upload
      description: |
        Anonim boleh, kena rate limit per IP (awal: 10 surat per jam). Server memvalidasi
        `design` dan `content`, lalu memastikan:

        - `photos[].key` sama persis dengan kunci `photo` di `content.elements` (urutan bebas);
        - `cover` wajib ada kalau `design.illustration` bernilai `upload`, dan harus kosong
          kalau tidak;
        - `replyTo`, kalau diisi, adalah slug surat yang masih berlaku. Slug surat titipan kotak
          bareng dianggap tidak ada (`reply_not_found`), sama seperti di `GET /l/{slug}`.
        - `og` diisi untuk surat biasa dan kosong untuk surat titipan (`og_mismatch`, 0.3.0);
        - `box`, kalau diisi (0.3.0): kode titipnya ada (`box_not_found`), kotaknya belum ditutup
          (`box_closed`), surat ini masih muat di batas kotak (`box_full`, lihat `BoxLimits`), dan
          `replyTo` kosong (`invalid_box`). Surat titipan tidak punya gambar OG, jadi
          `uploads.og` bernilai `null`.

        `editToken` hanya dikirim sekali di respons ini. Simpan di IndexedDB pengirim; server
        hanya menyimpan hash-nya. Untuk surat titipan, token ini juga dipakai pengirimnya untuk
        menarik suratnya lagi lewat `DELETE /letters/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLetterRequest'
            example:
              design:
                illustration: upload
                shape: portrait
                foilMode: detail
                foilBorder: true
                foilColor: gold
                paper: cream
                template: photo-1
              content:
                version: 1
                elements:
                  - { kind: photo, id: e1, x: 0.5, y: 0.32, width: 0.7, rotation: -3, photo: p1, aspect: 1.33 }
                  - { kind: text, id: e2, x: 0.5, y: 0.72, width: 0.8, rotation: 0, text: Selamat ulang tahun!, size: 0.07, align: center }
                  - { kind: sticker, id: e3, x: 0.84, y: 0.12, width: 0.18, rotation: 12, sticker: heart }
              cover: { type: image/jpeg, width: 1536, height: 2048, size: 412000 }
              photos:
                - { key: p1, type: image/webp, width: 2048, height: 1536, size: 380000 }
              og: { type: image/jpeg, width: 1200, height: 630, size: 110000 }
              replyTo: null
      responses:
        '201':
          description: Draf dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLetterResponse'
        '400':
          $ref: '#/components/responses/Invalid'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'

  /letters/{id}/publish:
    post:
      tags: [Pengirim]
      operationId: publishLetter
      summary: Terbitkan surat
      description: |
        Memeriksa semua berkas di Storage: ada, tipe sesuai, ukuran dan dimensi sama dengan
        metadata di `POST /letters` dan tidak melewati batas. Server juga membuang metadata
        EXIF yang tersisa sebagai lapis kedua. Kalau lolos, server membuat `slug` dan status
        surat menjadi `sent`.

        Surat titipan diperiksa sekali lagi terhadap kotaknya: masih terbuka untuk titipan
        (`422 box_closed`, juga kalau kotaknya sudah lewat masa berlaku) dan masih muat
        (`422 box_full`). Kalau kotaknya dihapus pembuatnya, draf titipannya ikut terhapus, jadi
        publish menjawab `404`. Responsnya membawa `box`, `url`-nya
        link titip kotak itu (bukan `/l/{slug}`), dan `expiresAt`-nya masa berlaku kotak.
      security:
        - publishableKey: []
          editToken: []
      parameters:
        - $ref: '#/components/parameters/LetterId'
      responses:
        '200':
          description: Surat terbit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishLetterResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Surat sudah pernah terbit. Body berisi slug dan link yang sama.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishLetterResponse'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /letters/{id}:
    delete:
      tags: [Pengirim]
      operationId: deleteLetter
      summary: Hapus surat beserta semua berkasnya
      description: |
        Berlaku untuk draf maupun surat yang sudah terbit. Link langsung mati. Surat titipan
        langsung keluar dari kotaknya, juga setelah kotak dibuka.
      security:
        - publishableKey: []
          editToken: []
      parameters:
        - $ref: '#/components/parameters/LetterId'
      responses:
        '204':
          description: Surat dan berkasnya dihapus.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /l/{slug}:
    get:
      tags: [Penerima]
      operationId: getLetter
      summary: Ambil surat untuk halaman penerima
      description: |
        Publik. Draf, surat yang sudah kedaluwarsa, dan surat yang dihapus sama-sama
        menghasilkan 404. Tidak mengubah `openedAt`. Surat titipan kotak bareng juga 404 di sini
        dan di `POST /l/{slug}/open`: isinya hanya dibaca lewat `GET /k/{slug}` milik kotaknya.
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Surat ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '404':
          $ref: '#/components/responses/NotFound'

  /l/{slug}/open:
    post:
      tags: [Penerima]
      operationId: openLetter
      summary: Tandai surat dibuka
      description: |
        Dipanggil saat penerima mengetuk kartu. Idempoten: panggilan pertama mengisi
        `openedAt` dan menjadwalkan penghapusan foto, panggilan berikutnya mengembalikan nilai
        yang sama tanpa mengubah apa pun.
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Waktu dibuka dan jadwal penghapusan foto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenLetterResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /boxes:
    post:
      tags: [Kotak]
      operationId: createBox
      summary: Bikin kotak bareng
      description: |
        Anonim boleh, kena rate limit per IP (awal: 5 kotak per jam, terpisah dari surat).

        `opensAt` adalah waktu kotak terbuka untuk penerima, sekaligus batas titipan. Kalau
        diisi, harus di antara sekarang dan sekarang + 30 hari (`invalid_box`), dan `scheduled`
        bernilai `true`. Kalau `null`, kotak dibuka manual oleh pembuatnya lewat
        `PATCH /boxes/{id}`; selama belum dibuka, `opensAt` di respons adalah batas akhirnya
        (`createdAt` + 30 hari) dan `scheduled` bernilai `false`.

        `editToken` hanya dikirim sekali di respons ini. Simpan di IndexedDB pembuat kotak;
        server hanya menyimpan hash-nya. `design` adalah id dari `packages/presets/kotak.json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoxRequest'
            example:
              title: Ultah ke-20 Rani
              to: Rani
              design: par-avion
              opensAt: '2026-10-20T12:00:00.000Z'
      responses:
        '201':
          description: Kotak dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBoxResponse'
        '400':
          $ref: '#/components/responses/Invalid'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'

  /boxes/{id}:
    get:
      tags: [Kotak]
      operationId: getBox
      summary: Kotak untuk pembuatnya
      description: |
        Semua yang dibutuhkan halaman kelola: kedua link, jadwal, pemakaian batas, dan daftar
        titipan. Isi surat titipan tidak ikut, supaya tetap jadi kejutan untuk penerima;
        pembuat kotak bisa menghapus titipan yang tidak pantas lewat namanya.
      security:
        - publishableKey: []
          editToken: []
      parameters:
        - $ref: '#/components/parameters/BoxId'
      responses:
        '200':
          description: Kotak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerBox'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BoxNotFound'
    patch:
      tags: [Kotak]
      operationId: updateBox
      summary: Ubah judul, desain, atau jadwal buka
      description: |
        Selama penerima belum membuka kotaknya (`openedAt` masih `null`), juga setelah `opensAt`
        lewat; setelah penerima membukanya, `409 box_closed` (0.4.2; sebelumnya ditolak begitu
        `opensAt` lewat). Jadi jadwal yang salah tidak terkunci begitu kotaknya terbuka.

        - `openNow: true` ("Buka sekarang"): `opensAt` diisi waktu server saat itu, dan
          `scheduled` jadi `true` karena `opensAt` sekarang waktu kotak benar-benar dibuka.
          Jam HP tidak dipakai, jadi HP yang jamnya maju atau mundur tetap membuka kotak. Kotak
          yang sudah terbuka tetap memakai `opensAt`-nya.
        - `opensAt` berupa waktu: menjadwalkan ulang (`scheduled` jadi `true`). Harus di depan
          jam server dan paling lambat `createdAt` + 30 hari, selain itu `422 invalid_box`.
          Kotak yang sudah terbuka tersegel lagi untuk penerima, dan titipan diterima lagi
          sampai jadwal baru.
        - `opensAt: null`: kembali ke mode manual (`opensAt` = `createdAt` + 30 hari, `scheduled`
          jadi `false`).
        - `openNow` dan `opensAt` tidak boleh dikirim bersamaan (`422 invalid_box`).

        `expiresAt` kotak dan semua titipannya ikut bergeser kalau `opensAt` berubah.
      security:
        - publishableKey: []
          editToken: []
      parameters:
        - $ref: '#/components/parameters/BoxId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoxRequest'
            example:
              openNow: true
      responses:
        '200':
          description: Kotak sesudah diubah.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerBox'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BoxNotFound'
        '409':
          $ref: '#/components/responses/BoxConflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [Kotak]
      operationId: deleteBox
      summary: Hapus kotak beserta semua titipannya
      description: |
        Link titip dan link buka langsung mati. Semua titipan ikut dihapus, termasuk draf yang
        belum terbit, beserta berkasnya lewat Storage API.
      security:
        - publishableKey: []
          editToken: []
      parameters:
        - $ref: '#/components/parameters/BoxId'
      responses:
        '204':
          description: Kotak dan titipannya dihapus.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BoxNotFound'

  /boxes/{id}/letters/{letterId}:
    delete:
      tags: [Kotak]
      operationId: removeBoxLetter
      summary: Pembuat kotak menghapus satu titipan
      description: Kapan saja, juga setelah kotak dibuka. Surat dan berkasnya dihapus.
      security:
        - publishableKey: []
          editToken: []
      parameters:
        - $ref: '#/components/parameters/BoxId'
        - name: letterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Titipan dihapus.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BoxNotFound'

  /boxes/invite/{invite}:
    get:
      tags: [Kotak]
      operationId: getBoxInvite
      summary: Kotak untuk yang mau titip surat
      description: |
        Publik, untuk halaman titip `/titip/{invite}` (di-SSR untuk preview WhatsApp). Hanya
        judul, nama penerima, desain, jadwal, dan pemakaian batas; isi titipan tidak pernah
        dikembalikan di sini.
      parameters:
        - $ref: '#/components/parameters/Invite'
      responses:
        '200':
          description: Kotak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoxInvite'
        '404':
          $ref: '#/components/responses/BoxNotFound'

  /k/{slug}:
    get:
      tags: [Kotak]
      operationId: getBoxForRecipient
      summary: Kotak untuk penerimanya
      description: |
        Publik, untuk halaman `/k/{slug}` (di-SSR untuk preview WhatsApp, `noindex`). Sebelum
        `opensAt`, `letters` kosong dan `openable` bernilai `false`, tapi `letterCount` sudah
        terisi. Tidak mengubah `openedAt`. Kotak yang dihapus atau lewat `expiresAt`: 404.
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Kotak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Box'
        '404':
          $ref: '#/components/responses/BoxNotFound'

  /k/{slug}/open:
    post:
      tags: [Kotak]
      operationId: openBox
      summary: Tandai kotak dibuka
      description: |
        Dipanggil saat penerima membuka surat pertama di kotak. Idempoten, seperti
        `POST /l/{slug}/open`: panggilan pertama mengisi `openedAt` dan menjadwalkan penghapusan
        foto semua titipan 7 hari kemudian. Sebelum `opensAt`: `409 box_not_open`.
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Waktu dibuka dan jadwal penghapusan foto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenLetterResponse'
        '404':
          $ref: '#/components/responses/BoxNotFound'
        '409':
          $ref: '#/components/responses/BoxConflict'

  /account:
    delete:
      tags: [Akun]
      operationId: deleteAccount
      summary: Hapus akun beserta semua cadangan Pocket
      description: |
        0.4.0. Menghapus akun yang sedang login dan semua datanya di server, langsung dan tanpa
        masa tunggu:

        1. semua berkas di bucket `moments` milik user (`<user_id>/…`), lewat Storage API;
        2. akun di Supabase Auth, yang ikut menghapus baris `profiles`, `moments`, `pockets`, dan
           `albums` miliknya (`on delete cascade`).

        Kalau langkah 2 gagal setelah langkah 1, server menjawab `500` dan request boleh diulang
        (idempoten selama akunnya masih ada). Berkas yang tertinggal juga dibersihkan job
        pembersihan tiap jam, karena berkas tanpa baris `moments` aktif dianggap sampah.

        Tidak menyentuh surat dan kotak bareng: keduanya tidak terikat ke akun dan tetap dihapus
        lewat `X-Edit-Token` masing-masing atau habis masa berlakunya. Data di perangkat
        (IndexedDB) juga tidak disentuh.

        Setelah `204`, sesi di browser sudah tidak berlaku. Frontend keluar di perangkat itu
        (`signOut()`). Perangkat lain yang masih login keluar sendiri saat token-nya diperbarui
        (paling lama 1 jam). Sampai itu, sinkron di sana ditolak: access token-nya masih sah,
        tapi baris baru gagal di foreign key ke `auth.users` dan unggahan ditolak policy Storage,
        jadi tidak ada berkas yatim baru.
      security:
        - publishableKey: []
          userSession: []
      responses:
        '204':
          description: Akun dan semua cadangannya dihapus.
        '401':
          description: |
            Header `Authorization` tidak ada, bukan access token proyek ini, sudah kedaluwarsa,
            atau akunnya sudah dihapus (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    publishableKey:
      type: apiKey
      in: header
      name: apikey
      description: Publishable key Supabase (`sb_publishable_…`).
    editToken:
      type: apiKey
      in: header
      name: X-Edit-Token
      description: |
        Token dari respons `POST /letters` (surat) atau `POST /boxes` (kotak bareng). Disimpan di
        browser pengirim atau pembuat kotak.
    userSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token sesi login Google dari Supabase Auth (0.4.0).

  parameters:
    LetterId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Slug'
    BoxId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Invite:
      name: invite
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/InviteCode'

  responses:
    Invalid:
      description: Body bukan JSON yang valid atau tidak sesuai skema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: |
        Bentuknya benar tapi isinya ditolak, misalnya id preset tidak dikenal, kunci foto tidak
        cocok dengan `content`, `replyTo` tidak ditemukan, atau berkas belum diunggah atau
        tidak sesuai metadata saat publish.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Header `X-Edit-Token` tidak ada atau tidak cocok.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Surat tidak ada, belum terbit, sudah kedaluwarsa, atau sudah dihapus.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BoxNotFound:
      description: |
        Kotak tidak ada, sudah lewat `expiresAt`, atau sudah dihapus pembuatnya. Kodenya selalu
        `box_not_found`, juga untuk id, kode titip, slug, atau id titipan yang bentuknya salah.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BoxConflict:
      description: |
        Penerima sudah membuka kotaknya, jadi kotaknya tidak bisa diubah lagi (`box_closed`), atau
        belum sampai `opensAt`, jadi belum bisa dibuka (`box_not_open`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Terlalu banyak surat atau kotak dari IP yang sama.
      headers:
        Retry-After:
          description: Detik sampai boleh mencoba lagi.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Id:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,40}$'
      description: Id elemen, kunci foto, atau id stiker.

    Slug:
      type: string
      pattern: '^[A-Za-z0-9]{10}$'
      description: 10 karakter acak base62.
      examples: [x7Kp2qLm9A]

    LetterDesign:
      type: object
      description: |
        Id preset dari `packages/presets/letter.json`, bukan nilai warnanya. Server menolak id
        yang tidak ada di preset.
      required: [illustration, shape, foilMode, foilBorder, foilColor, paper, template]
      additionalProperties: false
      properties:
        illustration:
          type: string
          description: Id ilustrasi (`meadow`, `sprig`, `night`, …) atau `upload` untuk foto user.
        shape:
          type: string
          description: '`original`, `portrait`, `square`, `landscape`, …'
        foilMode:
          type: string
          description: '`design`, `detail`, `shadow`, `color`. `design` tidak boleh dipakai bersama `upload`.'
        foilBorder:
          type: boolean
        foilColor:
          type: string
          description: '`gold`, `silver`, `rose-gold`, `copper`, `pink`, `holo`, …'
        paper:
          type: string
          description: '`white`, `cream`, `blush`, `sage`, `sky`, `navy`, …'
        template:
          type: string
          description: '`text`, `photo-1`, `photo-2`, `collage-4`, …'

    LetterContent:
      type: object
      description: |
        Elemen halaman surat. Posisi dan ukuran relatif terhadap halaman. Urutan `elements`
        adalah urutan tumpukan (terakhir paling atas). Maksimal 4 teks, 4 foto, dan 16 stiker;
        satu foto hanya dipakai sekali.
      required: [version, elements]
      additionalProperties: false
      properties:
        version:
          const: 1
        elements:
          type: array
          maxItems: 24
          items:
            $ref: '#/components/schemas/LetterElement'

    LetterElement:
      oneOf:
        - $ref: '#/components/schemas/TextElement'
        - $ref: '#/components/schemas/PhotoElement'
        - $ref: '#/components/schemas/StickerElement'
      discriminator:
        propertyName: kind
        mapping:
          text: '#/components/schemas/TextElement'
          photo: '#/components/schemas/PhotoElement'
          sticker: '#/components/schemas/StickerElement'

    ElementBase:
      type: object
      required: [id, x, y, width, rotation]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        x:
          type: number
          minimum: 0
          maximum: 1
          description: Titik tengah, pecahan lebar halaman.
        y:
          type: number
          minimum: 0
          maximum: 1
          description: Titik tengah, pecahan tinggi halaman.
        width:
          type: number
          minimum: 0.05
          maximum: 1
          description: Lebar elemen, pecahan lebar halaman.
        rotation:
          type: number
          minimum: -180
          maximum: 180
          description: Derajat searah jarum jam.

    TextElement:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ElementBase'
        - type: object
          required: [kind, text, size, align]
          properties:
            kind:
              const: text
            text:
              type: string
              minLength: 1
              maxLength: 600
              description: Maksimal 600 code point, tanpa karakter NUL. Tidak boleh kosong saat dikirim.
            size:
              type: number
              minimum: 0.02
              maximum: 0.25
              description: Ukuran huruf, pecahan lebar halaman.
            align:
              type: string
              enum: [left, center, right]

    PhotoElement:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ElementBase'
        - type: object
          required: [kind, photo, aspect]
          properties:
            kind:
              const: photo
            photo:
              $ref: '#/components/schemas/Id'
              description: Kunci di `photos`. Slot kosong (`null`) tidak boleh dikirim.
            aspect:
              type: number
              minimum: 0.2
              maximum: 5
              description: Lebar dibagi tinggi bingkai.

    StickerElement:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ElementBase'
        - type: object
          required: [kind, sticker]
          properties:
            kind:
              const: sticker
            sticker:
              $ref: '#/components/schemas/Id'
              description: Id stiker dari preset.

    ImageMeta:
      type: object
      description: Metadata foto setelah dikompres dan EXIF-nya dibuang di browser.
      required: [type, width, height, size]
      properties:
        type:
          type: string
          enum: [image/jpeg, image/webp]
        width:
          type: integer
          minimum: 1
          maximum: 2048
        height:
          type: integer
          minimum: 1
          maximum: 2048
        size:
          type: integer
          minimum: 1
          maximum: 500000
          description: Byte.

    CoverMeta:
      description: Gambar depan dari foto user. Batasnya sama dengan foto isi.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ImageMeta'

    PhotoMeta:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ImageMeta'
        - type: object
          required: [key]
          properties:
            key:
              $ref: '#/components/schemas/Id'

    OgMeta:
      type: object
      description: Sampul kartu untuk preview link. Frontend mengirim JPEG; PNG dari foto hampir selalu melewati 300 KB.
      required: [type, width, height, size]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [image/jpeg, image/png]
        width:
          const: 1200
        height:
          const: 630
        size:
          type: integer
          minimum: 1
          maximum: 300000
          description: Byte.

    CreateLetterRequest:
      type: object
      description: |
        `og` wajib untuk surat biasa. Surat titipan kotak bareng (`box` diisi) tidak punya gambar
        OG, jadi `og` dikosongkan atau `null`. Aturan ini dicek sebagai isi (`422 og_mismatch`),
        sama seperti `cover`.
      required: [design, content, photos]
      additionalProperties: false
      properties:
        design:
          $ref: '#/components/schemas/LetterDesign'
        content:
          $ref: '#/components/schemas/LetterContent'
        cover:
          description: Wajib kalau `design.illustration` bernilai `upload`, selain itu harus kosong. Tidak dihitung ke batas 4 foto.
          oneOf:
            - $ref: '#/components/schemas/CoverMeta'
            - type: 'null'
        photos:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/PhotoMeta'
        og:
          description: Gambar OG. Wajib untuk surat biasa, `null` atau tidak ada untuk surat titipan.
          oneOf:
            - $ref: '#/components/schemas/OgMeta'
            - type: 'null'
        replyTo:
          description: Slug surat yang dibalas lewat "Bikin balasan". Harus kosong untuk surat titipan.
          oneOf:
            - $ref: '#/components/schemas/Slug'
            - type: 'null'
        box:
          description: Titip surat ini ke kotak bareng (0.3.0).
          oneOf:
            - $ref: '#/components/schemas/BoxEntry'
            - type: 'null'

    UploadTarget:
      type: object
      description: Tujuan upload satu berkas. Berlaku 2 jam.
      required: [path, token, signedUrl]
      properties:
        path:
          type: string
          description: Path di bucket `letter-assets`, `<letterId>/<uuid>.<ext>`.
        token:
          type: string
          description: Token untuk `uploadToSignedUrl(path, token, file)`.
        signedUrl:
          type: string
          format: uri
          description: URL lengkap kalau mengunggah tanpa supabase-js (PUT dengan body berkas).

    CreateLetterResponse:
      type: object
      required: [id, editToken, draftExpiresAt, uploads]
      properties:
        id:
          type: string
          format: uuid
        editToken:
          type: string
          description: Hanya dikirim sekali. Simpan di browser untuk publish dan hapus.
        draftExpiresAt:
          type: string
          format: date-time
          description: Batas publish; setelah ini draf dan berkasnya dihapus.
        uploads:
          type: object
          required: [cover, photos, og]
          properties:
            cover:
              oneOf:
                - $ref: '#/components/schemas/UploadTarget'
                - type: 'null'
            photos:
              type: object
              description: Per kunci foto.
              additionalProperties:
                $ref: '#/components/schemas/UploadTarget'
            og:
              description: '`null` untuk surat titipan, yang tidak punya gambar OG.'
              oneOf:
                - $ref: '#/components/schemas/UploadTarget'
                - type: 'null'

    PublishLetterResponse:
      type: object
      required: [slug, url, publishedAt, expiresAt]
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        url:
          type: string
          format: uri
          description: Link surat. Untuk surat titipan, link titip kotaknya (`BoxInvite`).
          examples: [https://postpocket.vercel.app/l/x7Kp2qLm9A]
        publishedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: |
            `publishedAt` + 30 hari. Untuk surat titipan, `expiresAt` kotaknya saat itu: masih bisa
            bergeser selama kotaknya belum dibuka, karena jadwal kotak bisa diubah.
        box:
          description: Kotak tempat surat ini dititip. Hanya ada untuk surat titipan.
          $ref: '#/components/schemas/BoxReceipt'

    Asset:
      type: object
      description: Berkas publik di bucket `letter-assets`.
      required: [url, width, height]
      properties:
        url:
          type: string
          format: uri
        width:
          type: integer
        height:
          type: integer

    Letter:
      type: object
      required:
        - slug
        - design
        - content
        - cover
        - photos
        - og
        - replyTo
        - publishedAt
        - expiresAt
        - openedAt
        - photosExpireAt
        - photosDeletedAt
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        design:
          $ref: '#/components/schemas/LetterDesign'
        content:
          $ref: '#/components/schemas/LetterContent'
        cover:
          description: '`null` kalau gambar depannya ilustrasi, atau fotonya sudah dihapus.'
          oneOf:
            - $ref: '#/components/schemas/Asset'
            - type: 'null'
        photos:
          type: object
          description: Per kunci foto. Kosong (`{}`) setelah foto dihapus; slot di `content` tetap ada dan ditampilkan sebagai placeholder.
          additionalProperties:
            $ref: '#/components/schemas/Asset'
        og:
          description: '`null` setelah dihapus bersama cover. Frontend memakai gambar OG bawaan.'
          oneOf:
            - $ref: '#/components/schemas/Asset'
            - type: 'null'
        replyTo:
          description: Slug surat yang dibalas, kalau masih berlaku.
          oneOf:
            - $ref: '#/components/schemas/Slug'
            - type: 'null'
        publishedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        openedAt:
          type: [string, 'null']
          format: date-time
        photosExpireAt:
          type: [string, 'null']
          format: date-time
          description: '`openedAt` + 7 hari, dibatasi `expiresAt`. `null` kalau belum dibuka.'
        photosDeletedAt:
          type: [string, 'null']
          format: date-time
          description: Terisi begitu foto tidak ditampilkan lagi (sama dengan `photosExpireAt`, atau waktu job menghapusnya). Selama terisi, `photos` kosong.

    OpenLetterResponse:
      type: object
      required: [openedAt, photosExpireAt]
      properties:
        openedAt:
          type: string
          format: date-time
        photosExpireAt:
          type: string
          format: date-time

    InviteCode:
      type: string
      pattern: '^[A-Za-z0-9]{12}$'
      description: Kode titip kotak bareng, 12 karakter acak base62. Siapa pun yang memegangnya bisa menitip surat.
      examples: [Ab3dE6gH9jKm]

    BoxText:
      type: string
      minLength: 1
      maxLength: 40
      # Syarat "bukan hanya spasi" ditulis sebagai lookahead supaya waktunya linear. Bentuk lama
      # `^[^…]*[^\u0000\s][^…]*$` mundur-maju kuadratik: validasi body 100 KB berisi satu baris
      # panjang memakan beberapa detik CPU sebelum batas 40 karakter dan rate limit sempat menolak.
      pattern: '^(?=[^\u0000]*[^\u0000\s])[^\u0000\n\r]*$'
      description: |
        Teks pendek satu baris dari pengguna: judul kotak, nama penerima, atau nama pengirim.
        Maksimal 40 code point, tanpa karakter NUL atau ganti baris, dan tidak boleh hanya spasi.
        Server memangkas spasi di kedua ujungnya.

    FolderArtId:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,40}$'
      description: Id seni folder kaca dari `packages/presets/kotak.json`. Server menolak id yang tidak ada (`invalid_box`).

    BoxEntry:
      type: object
      description: Kotak tujuan surat titipan.
      required: [invite, from]
      additionalProperties: false
      properties:
        invite:
          $ref: '#/components/schemas/InviteCode'
        from:
          $ref: '#/components/schemas/BoxText'
          description: Nama pengirim, tampil di daftar titipan dan di balik sampul kartu.

    BoxLimits:
      type: object
      description: Batas per kotak, supaya kuota storage dan egress tetap aman. Diatur server.
      required: [letters, photos]
      properties:
        letters:
          type: integer
          description: Surat titipan per kotak. Awalnya 20.
        photos:
          type: integer
          description: Foto per kotak, termasuk cover dari foto user. Awalnya 40.

    BoxUsage:
      type: object
      required: [letters, photos]
      properties:
        letters:
          type: integer
          description: Surat titipan yang sudah terbit.
        photos:
          type: integer
          description: Foto dan cover di surat-surat itu.

    BoxReceipt:
      type: object
      description: Ringkasan kotak untuk pengirim surat titipan.
      required: [title, to, opensAt, scheduled]
      properties:
        title:
          $ref: '#/components/schemas/BoxText'
        to:
          $ref: '#/components/schemas/BoxText'
        opensAt:
          type: string
          format: date-time
        scheduled:
          type: boolean

    CreateBoxRequest:
      type: object
      required: [title, to, design, opensAt]
      additionalProperties: false
      properties:
        title:
          $ref: '#/components/schemas/BoxText'
          description: Judul kotak, misalnya "Ultah ke-20 Rani".
        to:
          $ref: '#/components/schemas/BoxText'
          description: Nama penerima, misalnya "Rani".
        design:
          $ref: '#/components/schemas/FolderArtId'
        opensAt:
          description: Waktu kotak terbuka untuk penerima, atau `null` untuk dibuka manual.
          type: [string, 'null']
          format: date-time

    UpdateBoxRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          $ref: '#/components/schemas/BoxText'
        to:
          $ref: '#/components/schemas/BoxText'
        design:
          $ref: '#/components/schemas/FolderArtId'
        opensAt:
          description: Jadwal baru, atau `null` untuk kembali ke mode manual.
          type: [string, 'null']
          format: date-time
        openNow:
          description: Buka kotak sekarang menurut jam server ("Buka sekarang").
          const: true

    OrganizerBox:
      type: object
      required:
        - id
        - slug
        - url
        - invite
        - inviteUrl
        - title
        - to
        - design
        - createdAt
        - opensAt
        - scheduled
        - openable
        - expiresAt
        - openedAt
        - photosExpireAt
        - photosDeletedAt
        - limits
        - usage
        - letters
      properties:
        id:
          type: string
          format: uuid
        slug:
          $ref: '#/components/schemas/Slug'
        url:
          type: string
          format: uri
          description: Link buka untuk penerima, `/k/{slug}`.
          examples: [https://postpocket.vercel.app/k/x7Kp2qLm9A]
        invite:
          $ref: '#/components/schemas/InviteCode'
        inviteUrl:
          type: string
          format: uri
          description: Link titip untuk teman-teman, `/titip/{invite}`.
          examples: [https://postpocket.vercel.app/titip/Ab3dE6gH9jKm]
        title:
          $ref: '#/components/schemas/BoxText'
        to:
          $ref: '#/components/schemas/BoxText'
        design:
          $ref: '#/components/schemas/FolderArtId'
        createdAt:
          type: string
          format: date-time
        opensAt:
          type: string
          format: date-time
          description: Kotak terbuka untuk penerima dan tertutup untuk titipan. Untuk kotak manual yang belum dibuka, batas akhirnya (`createdAt` + 30 hari).
        scheduled:
          type: boolean
          description: |
            `true` kalau `opensAt` dijadwalkan pembuatnya atau kotak sudah dibuka lewat "Buka
            sekarang". `false` kalau kotak dibuka manual dan belum dibuka: `opensAt` hanya batas
            akhirnya.
        openable:
          type: boolean
          description: '`opensAt` sudah lewat menurut jam server: penerima bisa membukanya dan titipan baru ditolak.'
        expiresAt:
          type: string
          format: date-time
          description: '`opensAt` + 30 hari. Kotak dan semua titipannya dihapus saat itu.'
        openedAt:
          type: [string, 'null']
          format: date-time
        photosExpireAt:
          type: [string, 'null']
          format: date-time
          description: '`openedAt` + 7 hari, dibatasi `expiresAt`. `null` kalau belum dibuka.'
        photosDeletedAt:
          type: [string, 'null']
          format: date-time
          description: Sama dengan `Box.photosDeletedAt`.
        limits:
          $ref: '#/components/schemas/BoxLimits'
        usage:
          $ref: '#/components/schemas/BoxUsage'
        letters:
          type: array
          description: Titipan yang sudah terbit, urut waktu terbit. Isinya tidak ikut.
          items:
            type: object
            required: [id, from, publishedAt, photos]
            properties:
              id:
                type: string
                format: uuid
              from:
                $ref: '#/components/schemas/BoxText'
              publishedAt:
                type: string
                format: date-time
              photos:
                type: integer
                description: Foto dan cover di surat ini.

    CreateBoxResponse:
      allOf:
        - $ref: '#/components/schemas/OrganizerBox'
        - type: object
          required: [editToken]
          properties:
            editToken:
              type: string
              description: Hanya dikirim sekali. Simpan di browser untuk semua endpoint `/boxes/{id}`.

    BoxInvite:
      type: object
      required: [title, to, design, opensAt, scheduled, closed, limits, usage]
      properties:
        title:
          $ref: '#/components/schemas/BoxText'
        to:
          $ref: '#/components/schemas/BoxText'
        design:
          $ref: '#/components/schemas/FolderArtId'
        opensAt:
          type: string
          format: date-time
          description: Batas titip. Untuk kotak manual, pembuatnya bisa menutupnya lebih cepat.
        scheduled:
          type: boolean
        closed:
          type: boolean
          description: '`opensAt` sudah lewat, jadi titipan baru ditolak (`box_closed`).'
        limits:
          $ref: '#/components/schemas/BoxLimits'
        usage:
          $ref: '#/components/schemas/BoxUsage'

    BoxLetter:
      type: object
      description: Satu surat titipan untuk penerima. Bentuknya sama dengan `Letter`, tanpa slug, OG, dan balasan.
      required: [id, from, design, content, cover, photos, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        from:
          $ref: '#/components/schemas/BoxText'
        design:
          $ref: '#/components/schemas/LetterDesign'
        content:
          $ref: '#/components/schemas/LetterContent'
        cover:
          description: '`null` kalau gambar depannya ilustrasi, atau fotonya sudah dihapus.'
          oneOf:
            - $ref: '#/components/schemas/Asset'
            - type: 'null'
        photos:
          type: object
          description: Per kunci foto. Kosong setelah foto kotak dihapus.
          additionalProperties:
            $ref: '#/components/schemas/Asset'
        publishedAt:
          type: string
          format: date-time

    Box:
      type: object
      required:
        - slug
        - title
        - to
        - design
        - opensAt
        - scheduled
        - openable
        - letterCount
        - letters
        - openedAt
        - photosExpireAt
        - photosDeletedAt
        - expiresAt
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          $ref: '#/components/schemas/BoxText'
        to:
          $ref: '#/components/schemas/BoxText'
        design:
          $ref: '#/components/schemas/FolderArtId'
        opensAt:
          type: string
          format: date-time
        scheduled:
          type: boolean
          description: '`false` berarti pembuatnya bisa membukanya lebih cepat; `opensAt` hanya batas akhirnya.'
        openable:
          type: boolean
          description: '`opensAt` sudah lewat menurut jam server, jadi `letters` terisi.'
        letterCount:
          type: integer
          description: Jumlah titipan, juga sebelum kotak terbuka.
        letters:
          type: array
          description: Kosong sampai `openable`. Urut waktu terbit.
          items:
            $ref: '#/components/schemas/BoxLetter'
        openedAt:
          type: [string, 'null']
          format: date-time
        photosExpireAt:
          type: [string, 'null']
          format: date-time
        photosDeletedAt:
          type: [string, 'null']
          format: date-time
          description: |
            Terisi begitu foto titipan tidak ditampilkan lagi: waktu job menghapusnya, atau
            `photosExpireAt` begitu waktu itu lewat walau job belum jalan (sama seperti
            `Letter.photosDeletedAt`). Selama terisi, `photos` dan cover dari foto user kosong.
        expiresAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - invalid_design
                - invalid_content
                - photo_mismatch
                - cover_mismatch
                - reply_not_found
                - upload_missing
                - upload_invalid
                - unauthorized
                - not_found
                - rate_limited
                - internal
                - og_mismatch
                - invalid_box
                - box_not_found
                - box_closed
                - box_full
                - box_not_open
            message:
              type: string
              description: Penjelasan untuk developer, bukan untuk ditampilkan ke user.
            details:
              type: array
              description: Lokasi field yang bermasalah, misalnya `content.elements[2].size`.
              items:
                type: object
                required: [path, message]
                properties:
                  path:
                    type: string
                  message:
                    type: string
